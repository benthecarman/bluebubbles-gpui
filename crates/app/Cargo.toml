[package]
name = "bluebubbles-gpui"
description = "Native Linux client for the BlueBubbles Server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bluebubbles-gpui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bb-api = { path = "../api" }
bb-core = { path = "../core" }
bb-store = { path = "../store" }
bb-ui = { path = "../ui" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
futures.workspace = true
gpui-kit.workspace = true
image.workspace = true
# Hunspell-compatible spellchecking for the composer.
spellbook = "0.4"
# Emoji and their GitHub shortcodes, for :joy: in the composer.
emojis = "0.9"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
url.workspace = true

# The desktop services the app uses on Linux: the tray icon, the keyring,
# and notifications and the dock count over D-Bus.
[target.'cfg(target_os = "linux")'.dependencies]
# For its activation-token patch; third_party/README.md.
gpui-pre-linux = "0.3.8"
ksni = { version = "0.3", default-features = false, features = ["async-io"] }
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }

# And their Windows equivalents: the notification area, Credential
# Manager, toast notifications and the sound they make.
[target.'cfg(windows)'.dependencies]
# Ogg Vorbis to WAV, the one format Windows plays itself.
lewton = "0.10"
tray-icon = { version = "0.26", default-features = false }
# The version GPUI uses.
windows = { version = "0.62", features = [
    "Data_Xml_Dom",
    "Foundation",
    "UI_Notifications",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security_Credentials",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
windows-registry = "0.6"

[target.'cfg(windows)'.build-dependencies]
# The app's icon in the .exe, where GPUI looks for the window's.
winresource = "0.1"

[package.metadata.deb]
name = "bluebubbles-gpui"
maintainer = "Ben Carman <benthecarman@live.com>"
copyright = "2026, BlueBubbles GPUI contributors"
license-file = ["../../LICENSE", "0"]
extended-description = "Native desktop client for the BlueBubbles Server: iMessage and SMS from your Mac, in a window laid out like Apple's Messages."
section = "net"
priority = "optional"
depends = "$auto, libvulkan1, libxkbcommon-x11-0, libwayland-client0, libfontconfig1, gnome-keyring | kwalletmanager | keepassxc"
# Draws a video's first frame in the transcript.
recommends = "ffmpeg"
assets = [
    ["target/release/bluebubbles-gpui", "usr/bin/", "755"],
    ["../../packaging/linux/bluebubbles-gpui.desktop", "usr/share/applications/", "644"],
    ["../../assets/icons/bluebubbles-128.png", "usr/share/icons/hicolor/128x128/apps/bluebubbles-gpui.png", "644"],
    ["../../assets/icons/bluebubbles-256.png", "usr/share/icons/hicolor/256x256/apps/bluebubbles-gpui.png", "644"],
    ["../../assets/icons/bluebubbles-512.png", "usr/share/icons/hicolor/512x512/apps/bluebubbles-gpui.png", "644"],
    ["../../NOTICE.md", "usr/share/doc/bluebubbles-gpui/", "644"],
    ["../../assets/dictionaries/en_US.license", "usr/share/doc/bluebubbles-gpui/", "644"],
]
