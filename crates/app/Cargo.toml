[package]
name = "bluebubbles-gpui"
description = "Native Linux client for the BlueBubbles Server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bluebubbles-gpui"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
bb-api = { path = "../api" }
bb-core = { path = "../core" }
bb-store = { path = "../store" }
bb-ui = { path = "../ui" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "6"
futures.workspace = true
gpui-kit.workspace = true
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
oo7 = { version = "0.6", default-features = false, features = ["async-std", "native_crypto"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1"
url.workspace = true

[package.metadata.deb]
name = "bluebubbles-gpui"
maintainer = "Ben Carman <benthecarman@live.com>"
copyright = "2026, BlueBubbles GPUI contributors"
license-file = ["../../LICENSE", "0"]
extended-description = "Native desktop client for the BlueBubbles Server: iMessage and SMS from your Mac, in a window laid out like Apple's Messages."
section = "net"
priority = "optional"
depends = "$auto, libvulkan1, libxkbcommon-x11-0, libwayland-client0, libfontconfig1, gnome-keyring | kwalletmanager | keepassxc"
assets = [
    ["target/release/bluebubbles-gpui", "usr/bin/", "755"],
    ["../../packaging/linux/bluebubbles-gpui.desktop", "usr/share/applications/", "644"],
    ["../../assets/icons/bluebubbles-128.png", "usr/share/icons/hicolor/128x128/apps/bluebubbles-gpui.png", "644"],
    ["../../assets/icons/bluebubbles-256.png", "usr/share/icons/hicolor/256x256/apps/bluebubbles-gpui.png", "644"],
    ["../../assets/icons/bluebubbles-512.png", "usr/share/icons/hicolor/512x512/apps/bluebubbles-gpui.png", "644"],
    ["../../NOTICE.md", "usr/share/doc/bluebubbles-gpui/", "644"],
]
