[workspace]
members = ["crates/*"]
# Vendored crates are patched in, not developed here.
exclude = ["third_party"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
anyhow = "1"
futures = "0.3"
# Photo decoding: what Messages sends and contact pictures come in.
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
# GPUI (gpui-pre 0.3.8) and its base components, in one dependency.
gpui-kit = "=0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-native-roots", "url"] }
tracing = "0.1"
url = "2"

# GPUI's Linux platform with this app's patches; third_party/README.md
# lists them.
[patch.crates-io]
gpui-pre-linux = { path = "third_party/gpui-pre-linux" }
